apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-loki
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "20"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-loki-token
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    kubernetes.io/service-account.name: grafana-loki
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-logging-application-view
  annotations:
    argocd.argoproj.io/sync-wave: "20"
rules:
  - apiGroups:
      - loki.grafana.com
    # Recursos ou dependências desta seção; avaliar seu escopo antes de alterar.
    resources:
      - application
    resourceNames:
      - logs
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-loki-application-view
  annotations:
    argocd.argoproj.io/sync-wave: "20"
# Referência de permissão; este vínculo não cria identidades no provedor.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-application-view
# Identidades que recebem as permissões declaradas pelo papel referenciado.
subjects:
  - kind: ServiceAccount
    name: grafana-loki
    namespace: grafana
