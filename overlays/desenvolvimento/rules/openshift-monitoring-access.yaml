# Token dedicado e somente leitura para consultar o Thanos Querier do cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-monitoring
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-ocp-token
  namespace: grafana
  annotations:
    kubernetes.io/service-account.name: grafana-monitoring
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-cluster-monitoring-view
# Referência de permissão; este vínculo não cria identidades no provedor.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
# Identidades que recebem as permissões declaradas pelo papel referenciado.
subjects:
  - kind: ServiceAccount
    name: grafana-monitoring
    namespace: grafana
